# 공통 코드(Sources/DeskPet/Core)가 맥 밖에서도 빌드되고 검사를 통과하는지 확인 (윈도우 이식 1단계)
# 윈도우 PC 없이 GitHub Actions 러너로 확인함. 맥 앱 빌드·SpriteForge 검사는 맥에서 scripts/verify.sh로
name: Core portability

on:
  push:
    branches: [main, 'windows-port/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIFT_VERSION: "6.3.3"

jobs:
  windows:
    name: Windows (Core build + checks)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # 셸 스크립트가 CRLF로 바뀌면 bash가 못 읽으므로 줄 끝을 그대로 둠
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
      - name: swift build (DeskPetCore)
        run: swift build
      - name: Checks
        shell: bash
        run: scripts/verify.sh
      # AI 작업 알림 훅(README 윈도우 줄과 같은 명령): Git Bash가 자기 윈도우 PID를 적고, 파일이 읽힐 때까지(최대 약 0.3초)
      # 살아 있어야 DeskPet이 그 PID에서 부모를 따라 올라갈 수 있음. DeskPet이 꺼져 있으므로 기다림이 끝나고 파일은 남음
      - name: AI alert hook (Git Bash)
        shell: pwsh
        timeout-minutes: 2
        run: |
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          $signals = Join-Path $env:USERPROFILE '.deskpet\signals'
          Remove-Item "$signals\*" -Force -ErrorAction SilentlyContinue
          $hook = 'mkdir -p ~/.deskpet/signals && read w < /proc/$$/winpid && f=~/.deskpet/signals/$$ && printf ''{"kind":"working","source":"claude","pid":%s}'' $w > $f.tmp && mv $f.tmp $f.json && for i in 1 2 3; do [ -e $f.json ] || break; sleep 0.1; done'
          $info = [System.Diagnostics.ProcessStartInfo]::new($bash)
          $info.ArgumentList.Add('-c')
          $info.ArgumentList.Add($hook)
          $info.UseShellExecute = $false
          $clock = [System.Diagnostics.Stopwatch]::StartNew()
          $bashProcess = [System.Diagnostics.Process]::Start($info)
          $seen = $null
          while (-not $bashProcess.HasExited) {
            $file = Get-ChildItem $signals -Filter *.json -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($file -and -not $seen) {
              $signal = Get-Content $file.FullName -Raw | ConvertFrom-Json
              $seen = Get-Process -Id $signal.pid -ErrorAction SilentlyContinue
              Write-Host "signal: $(Get-Content $file.FullName -Raw), process: $($seen.ProcessName)"
            }
            Start-Sleep -Milliseconds 15
          }
          $clock.Stop()
          if ($bashProcess.ExitCode -ne 0) { throw "hook exited with $($bashProcess.ExitCode)" }
          $file = Get-ChildItem $signals -Filter *.json | Select-Object -First 1
          if (-not $file) { throw "hook wrote no signal file" }
          $signal = Get-Content $file.FullName -Raw | ConvertFrom-Json
          if ($signal.kind -ne 'working' -or $signal.source -ne 'claude') { throw "unexpected signal: $(Get-Content $file.FullName -Raw)" }
          if (-not $seen) { throw "pid $($signal.pid) was not a live Windows process while the hook waited" }
          if ($seen.ProcessName -ne 'bash') { throw "pid $($signal.pid) is $($seen.ProcessName), expected bash" }
          Write-Host "hook took $($clock.ElapsedMilliseconds) ms with DeskPet closed"
          Remove-Item "$signals\*" -Force
      # 연기 시험: 메모장을 띄우고 DeskPet.exe를 32초 돌려, 모니터·창 목록·펫·트레이·그린 픽셀·장식·입력을 확인하고 화면을 캡처함
      - name: Smoke test (DeskPet.exe)
        shell: pwsh
        timeout-minutes: 3
        env:
          DESKPET_DATA_DIR: ${{ runner.temp }}\deskpet
        run: |
          $bin = (swift build --show-bin-path).Trim()
          # Claude 사용량: 상태줄이 남기는 파일을 미리 둠 (5시간 85%, 한 시간 뒤 초기화 → 펫 기력 weary)
          New-Item -ItemType Directory -Force $env:DESKPET_DATA_DIR | Out-Null
          $resets = [DateTimeOffset]::UtcNow.AddHours(1).ToUnixTimeSeconds()
          Set-Content "$env:DESKPET_DATA_DIR\claude-usage.json" "{`"five_hour`":{`"used_percentage`":85,`"resets_at`":$resets}}"
          Start-Process notepad
          Start-Sleep -Seconds 3
          $seconds = 32
          $app = Start-Process -FilePath "$bin\DeskPet.exe" -ArgumentList '--smoke', "$seconds", '--drive', '--scene', '--report', 'smoke.json' -PassThru -NoNewWindow
          # --drive: 펫이 올라탄 창을 앱이 조금씩 옮기고, 실제 입력(SendInput)으로 펫을 끌어 던지고·찌르고·우클릭 메뉴를 열었다 닫음
          # --scene: 그 뒤 모자·든 물건·이모지 말풍선을 두고, 무기를 던지고, 물건을 떨어뜨려 클릭하고, 입력 창으로 이름을 지음.
          #          끝으로 메모장 아래 숨은 자식의 기다림 신호 → 메모장 아이콘 ✋ → 메모장을 내리고 펫을 눌러 다시 앞으로
          # 첫 캡처 때 README 훅을 한 번 돌려, 켜진 DeskPet이 신호 파일을 곧바로 가져가 훅이 빨리 끝나는지 봄
          $bash = Join-Path $env:ProgramFiles 'Git\bin\bash.exe'
          $hook = 'mkdir -p ~/.deskpet/signals && read w < /proc/$$/winpid && f=~/.deskpet/signals/$$ && printf ''{"kind":"working","source":"claude","pid":%s}'' $w > $f.tmp && mv $f.tmp $f.json && for i in 1 2 3; do [ -e $f.json ] || break; sleep 0.1; done'
          $hookLeft = $null
          # 3초마다 화면 캡처 (DWM이 합성한 화면이라 레이어드 창도 찍힘). 캡처가 안 돼도 판정은 보고서로 함
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shots = 0
          while (-not $app.HasExited -and $shots -lt 10) {
            Start-Sleep -Seconds 3
            if ($null -eq $hookLeft) {
              $clock = [System.Diagnostics.Stopwatch]::StartNew()
              $info = [System.Diagnostics.ProcessStartInfo]::new($bash)
              $info.ArgumentList.Add('-c')
              $info.ArgumentList.Add($hook)
              $info.UseShellExecute = $false
              [System.Diagnostics.Process]::Start($info).WaitForExit()
              $clock.Stop()
              $hookLeft = @(Get-ChildItem (Join-Path $env:USERPROFILE '.deskpet\signals') -Filter *.json -ErrorAction SilentlyContinue).Count
              Write-Host "hook with DeskPet running: $($clock.ElapsedMilliseconds) ms, files left: $hookLeft"
            }
            try {
              $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
              $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
              $graphics = [System.Drawing.Graphics]::FromImage($shot)
              $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
              $shots += 1
              $shot.Save("$pwd\screen-$shots.png", [System.Drawing.Imaging.ImageFormat]::Png)
            } catch { Write-Host "screenshot failed: $_" }
          }
          $app.WaitForExit()
          if (-not (Test-Path smoke.json)) { throw "no smoke report (exit code $($app.ExitCode))" }
          Get-Content smoke.json
          $r = Get-Content smoke.json -Raw | ConvertFrom-Json
          if ($r.displays.Count -lt 1) { throw "no displays" }
          if (-not ($r.windows | Where-Object { $_.owner -like '*notepad*' })) { throw "notepad window not listed" }
          if ($r.pets.Count -lt 1) { throw "no pets" }
          if ($r.drawings -lt 1) { throw "no drawings composed" }
          # 60Hz면 초당 60틱. 2코어 러너에서 디버그 빌드가 그리는 동안 캡처까지 돌면 초당 43~51틱(2c 측정).
          # 타이머가 예전처럼 31ms로 늘어나면(초당 약 32틱) 걸리게 초당 35틱을 바닥으로 둠
          if ($r.ticks -lt 35 * $seconds) { throw "too few ticks: $($r.ticks) in ${seconds}s" }
          $visible = ($r.overlays | Measure-Object -Property visiblePixels -Sum).Sum
          if ($visible -lt 100) { throw "overlays show almost nothing: $visible pixels" }
          # 창 따라가기: 펫이 창과 같은 만큼 움직이고 여전히 그 창 위에 있음
          $d = $r.drive
          Write-Host "drive notes: $($d.notes -join '; ')"
          $f = $d.follow
          if ($f.error) { throw "follow: $($f.error)" }
          if ($f.windowMoved[0] -lt 50) { throw "window did not move: $($f.windowMoved -join ',')" }
          foreach ($i in 0, 1) {
            if ([math]::Abs($f.petMoved[$i] - $f.windowMoved[$i]) -gt 2) { throw "pet did not ride along: pet $($f.petMoved -join ',') window $($f.windowMoved -join ',') (pet was $($f.riderBehavior))" }
          }
          if (-not $f.stillOnWindow) { throw "pet fell off the moved window" }
          # 펫 누르기: 끌어 던지기·찌르기·우클릭 메뉴
          foreach ($event in 'picked up', 'released', 'poked') {
            if (-not ($d.gestures | Where-Object { $_ -like "*$event*" })) { throw "no '$event' gesture: $($d.gestures -join '; ')" }
          }
          if ($d.petMenuRows -lt 3) { throw "pet menu did not open (rows: $($d.petMenuRows))" }
          if ($d.finishedSteps -ne $d.totalSteps) { throw "driver stopped at step $($d.finishedSteps)/$($d.totalSteps)" }
          # 3단계: 장식이 그려지고, 말풍선 이모지가 컬러로 나오고, 물건 클릭과 이름 짓기가 됨
          $s = $r.scene
          $drawn = $r.stage.mostDrawn
          Write-Host "scene notes: $($s.notes -join '; '), drawn: $($drawn | ConvertTo-Json -Compress)"
          foreach ($layer in 'hats', 'held', 'bubbles', 'items', 'glints', 'weapons', 'sparks') {
            if (-not $drawn.$layer) { throw "nothing drawn on layer '$layer'" }
          }
          if (-not ($drawn.bursts -or $drawn.dust)) { throw "weapons never burst" }
          if ($r.stage.bubbleFailures -gt 0) { throw "DirectWrite failed $($r.stage.bubbleFailures) times" }
          if ($r.stage.bubbleColorPixels -lt 20) { throw "emoji bubble has no color: $($r.stage.bubbleColorPixels) colored pixels" }
          if (-not $s.itemClicked) { throw "item click did not reach the item" }
          if (-not $s.promptOpened) { throw "naming prompt did not open" }
          if (-not $s.renamed) { throw "pet was not renamed through the prompt" }
          if ($s.finishedSteps -ne $s.totalSteps) { throw "scene probe stopped at step $($s.finishedSteps)/$($s.totalSteps)" }
          # AI 작업 알림: 받는 함이 훅 파일을 가져가고, 숨은 자식에서 메모장을 찾아 아이콘 ✋, 펫을 누르면 메모장이 앞으로
          $a = $r.agents
          Write-Host "agents: $($a | ConvertTo-Json -Compress), scene: notice $($s.agentNotice) badge $($s.agentBadge) app $($s.agentApp) host $($s.agentHostPID) signal $($s.agentSignalPID)"
          if ($hookLeft -ne 0) { throw "running DeskPet left $hookLeft hook signal files" }
          if ($s.agentNotice -ne '✋') { throw "no pet held the waiting signal: '$($s.agentNotice)'" }
          if ($s.agentApp -ne $s.agentHostPID) { throw "bubble app $($s.agentApp) is not notepad $($s.agentHostPID)" }
          if ($s.agentSignalPID -eq $s.agentHostPID) { throw "signal came from notepad itself; the parent walk was not tried" }
          if ($a.lastHost.depth -lt 1) { throw "host was not found through a parent: $($a.lastHost | ConvertTo-Json -Compress)" }
          if (-not $s.agentBadge) { throw "waiting bubble has no app icon" }
          if ($r.stage.bubblesBadged -lt 1) { throw "no bubble was drawn with an app icon" }
          if (-not $s.agentForeground) { throw "poking the pet did not bring notepad forward (cleared: $($s.agentCleared))" }
          if ($a.broughtForward -lt 1) { throw "SetForegroundWindow never succeeded ($($a.bringForwardAsked) asked)" }
          # 4단계: 키 누른 수(내용 없이), 마이크 확인(WASAPI), Claude 사용량, 펫 트레이 아이콘
          $senses = $r.senses
          Write-Host "senses: $($senses | ConvertTo-Json -Compress), usage: $($r.usage | ConvertTo-Json -Compress)"
          if (-not $senses.listening) { throw "key-press counter not listening" }
          if ($senses.keyPresses -lt $s.keysSent) { throw "key presses counted $($senses.keyPresses) of $($s.keysSent) sent" }
          if ($senses.microphoneChecks -lt 1) { throw "microphone never checked" }
          if ($r.usage.summary -ne '5h 85%') { throw "usage summary '$($r.usage.summary)'" }
          if ($r.usage.vigor -ne 2) { throw "vigor $($r.usage.vigor), expected weary (2)" }
          if (-not $r.trayPetIcon) { throw "tray icon is not the pet" }
          Write-Host "tray icon shown: $($r.tray), visible pet pixels: $visible, rode $($f.owner) by $($f.petMoved -join ','), gestures: $($d.gestures -join '; ')"
          Write-Host "bubbles painted: $($r.stage.bubblesPainted) (color pixels $($r.stage.bubbleColorPixels)), clicked $($s.item), renamed: $($s.renamed)"
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke
          path: |
            smoke.json
            screen-*.png
            ${{ runner.temp }}\deskpet\Logs\pet_debug.log
          if-no-files-found: ignore

  # 포장 확인: 릴리스 zip을 만들고 install.ps1로 설치한 뒤, Swift가 없는 PATH로 설치본을 실행해 DLL이 다 들었는지 봄
  windows-package:
    name: Windows (package + install)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
      - name: Package
        shell: pwsh
        run: scripts/package_windows.ps1
      - name: Install, run without Swift, uninstall
        shell: pwsh
        timeout-minutes: 5
        env:
          DESKPET_DATA_DIR: ${{ runner.temp }}\deskpet-installed
        run: |
          $env:DESKPET_URL = (Resolve-Path dist\DeskPet-windows.zip).Path
          $env:DESKPET_DIR = "$env:RUNNER_TEMP\DeskPetApp"
          $env:DESKPET_NO_LAUNCH = '1'
          & .\install.ps1
          $exe = "$env:DESKPET_DIR\DeskPet.exe"
          if (-not (Test-Path $exe)) { throw "not installed" }
          $link = Join-Path ([Environment]::GetFolderPath('Programs')) 'DeskPet.lnk'
          if (-not (Test-Path $link)) { throw "no Start menu shortcut" }
          $skins = Get-ChildItem "$env:DESKPET_DIR\Assets\Skins" -Directory | ForEach-Object Name
          $private = Get-Content scripts\private-skins.txt | Where-Object { $_ -and -not $_.StartsWith('#') }
          if ($skins | Where-Object { $private -contains $_ }) { throw "private skin in the zip" }
          # 창 없는 실행 파일인지 (PE 헤더의 Subsystem = 2, WINDOWS_GUI)
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 24 + 68)
          if ($subsystem -ne 2) { throw "subsystem $subsystem, expected WINDOWS_GUI (2)" }
          # Swift 런타임이 PATH에 없어도 뜨는지 (다른 폴더에서 실행해 실행 파일 옆 캐릭터를 찾는지도)
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $report = "$env:RUNNER_TEMP\installed-smoke.json"
          $app = Start-Process -FilePath $exe -ArgumentList '--smoke', '6', '--report', $report -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw "installed app did not finish" }
          if (-not (Test-Path $report)) { throw "installed app wrote no report (exit code $($app.ExitCode)), missing DLL?" }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          if ($r.skins.Count -lt 10) { throw "installed app found $($r.skins.Count) skins at $($r.skinsDirectory)" }
          if ($r.ticks -lt 100) { throw "installed app ticked $($r.ticks) times" }
          if ($r.stage.bubbleFailures -gt 0) { throw "DirectWrite failed in the installed app" }
          Write-Host "installed app: $($r.skins.Count) skins from $($r.skinsDirectory), $($r.ticks) ticks, tray $($r.tray), pet icon $($r.trayPetIcon)"
          $env:DESKPET_UNINSTALL = '1'
          & .\install.ps1
          if (Test-Path $env:DESKPET_DIR) { throw "uninstall left $env:DESKPET_DIR" }
          if (Test-Path $link) { throw "uninstall left the shortcut" }
      - name: Upload package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/DeskPet-windows.zip
            ${{ runner.temp }}\installed-smoke.json
            ${{ runner.temp }}\deskpet-installed\Logs\pet_debug.log
          if-no-files-found: ignore

  linux:
    name: Linux (Core build + checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # container에는 env를 쓸 수 없어 버전을 직접 적음 (SWIFT_VERSION과 맞출 것)
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift build (DeskPetCore)
        run: swift build
      - name: Checks
        run: scripts/verify.sh
