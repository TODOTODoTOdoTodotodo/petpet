# 공통 코드(Sources/DeskPet/Core)가 맥 밖에서도 빌드되고 검사를 통과하는지 확인 (윈도우 이식 1단계)
# 윈도우 PC 없이 GitHub Actions 러너로 확인함. 맥 앱 빌드·SpriteForge 검사는 맥에서 scripts/verify.sh로
name: Core portability

on:
  push:
    branches: [main, 'windows-port/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SWIFT_VERSION: "6.3.3"

jobs:
  windows:
    name: Windows (Core build + checks)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      # 셸 스크립트가 CRLF로 바뀌면 bash가 못 읽으므로 줄 끝을 그대로 둠
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@v0.5.1
        with:
          swift-version: swift-${{ env.SWIFT_VERSION }}-release
          swift-build: ${{ env.SWIFT_VERSION }}-RELEASE
      - name: swift build (DeskPetCore)
        run: swift build
      - name: Checks
        shell: bash
        run: scripts/verify.sh
      # 연기 시험: 메모장을 띄우고 DeskPet.exe를 8초 돌려, 모니터·창 목록·펫·트레이·그린 픽셀을 확인하고 화면을 캡처함
      - name: Smoke test (DeskPet.exe)
        shell: pwsh
        timeout-minutes: 3
        env:
          DESKPET_DATA_DIR: ${{ runner.temp }}\deskpet
        run: |
          $bin = (swift build --show-bin-path).Trim()
          Start-Process notepad
          Start-Sleep -Seconds 3
          $app = Start-Process -FilePath "$bin\DeskPet.exe" -ArgumentList '--smoke', '14', '--drive', '--report', 'smoke.json' -PassThru -NoNewWindow
          # --drive: 펫이 올라탄 창을 앱이 조금씩 옮기고, 실제 입력(SendInput)으로 펫을 끌어 던지고·찌르고·우클릭 메뉴를 열었다 닫음
          # 창을 옮긴 뒤 화면 캡처 (DWM이 합성한 화면이라 레이어드 창도 찍힘).
          # 캡처가 안 돼도 판정은 보고서의 픽셀 수로 함
          Start-Sleep -Seconds 5
          try {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $screen = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $shot = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
            $graphics = [System.Drawing.Graphics]::FromImage($shot)
            $graphics.CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
            $shot.Save("$pwd\screen.png", [System.Drawing.Imaging.ImageFormat]::Png)
          } catch { Write-Host "screenshot failed: $_" }
          $app.WaitForExit()
          if (-not (Test-Path smoke.json)) { throw "no smoke report (exit code $($app.ExitCode))" }
          Get-Content smoke.json
          $r = Get-Content smoke.json -Raw | ConvertFrom-Json
          if ($r.displays.Count -lt 1) { throw "no displays" }
          if (-not ($r.windows | Where-Object { $_.owner -like '*notepad*' })) { throw "notepad window not listed" }
          if ($r.pets.Count -lt 1) { throw "no pets" }
          if ($r.drawings -lt 1) { throw "no drawings composed" }
          # 60Hz면 초당 60틱. 2코어 러너에서 디버그 빌드가 그리는 동안 캡처까지 돌면 초당 43~51틱(2c 측정).
          # 타이머가 예전처럼 31ms로 늘어나면(초당 약 32틱) 걸리게 초당 35틱을 바닥으로 둠
          if ($r.ticks -lt 35 * 14) { throw "too few ticks: $($r.ticks) in 14s" }
          $visible = ($r.overlays | Measure-Object -Property visiblePixels -Sum).Sum
          if ($visible -lt 100) { throw "overlays show almost nothing: $visible pixels" }
          # 창 따라가기: 펫이 창과 같은 만큼 움직이고 여전히 그 창 위에 있음
          $d = $r.drive
          Write-Host "drive notes: $($d.notes -join '; ')"
          $f = $d.follow
          if ($f.error) { throw "follow: $($f.error)" }
          if ($f.windowMoved[0] -lt 50) { throw "window did not move: $($f.windowMoved -join ',')" }
          foreach ($i in 0, 1) {
            if ([math]::Abs($f.petMoved[$i] - $f.windowMoved[$i]) -gt 2) { throw "pet did not ride along: pet $($f.petMoved -join ',') window $($f.windowMoved -join ',')" }
          }
          if (-not $f.stillOnWindow) { throw "pet fell off the moved window" }
          # 펫 누르기: 끌어 던지기·찌르기·우클릭 메뉴
          foreach ($event in 'picked up', 'released', 'poked') {
            if (-not ($d.gestures | Where-Object { $_ -like "*$event*" })) { throw "no '$event' gesture: $($d.gestures -join '; ')" }
          }
          if ($d.petMenuRows -lt 3) { throw "pet menu did not open (rows: $($d.petMenuRows))" }
          if ($d.finishedSteps -ne $d.totalSteps) { throw "driver stopped at step $($d.finishedSteps)/$($d.totalSteps)" }
          Write-Host "tray icon shown: $($r.tray), visible pet pixels: $visible, rode $($f.owner) by $($f.petMoved -join ','), gestures: $($d.gestures -join '; ')"
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke
          path: |
            smoke.json
            screen.png
            ${{ runner.temp }}\deskpet\Logs\pet_debug.log
          if-no-files-found: ignore

  linux:
    name: Linux (Core build + checks)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # container에는 env를 쓸 수 없어 버전을 직접 적음 (SWIFT_VERSION과 맞출 것)
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v4
      - name: swift build (DeskPetCore)
        run: swift build
      - name: Checks
        run: scripts/verify.sh
